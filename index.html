<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      font-family: 'Outfit', sans-serif;
      position: relative;
    }

    /* 背景グロー */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.3;
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite alternate;
    }

    .bg-glow.g1 {
      background: #6366f1;
      top: 20%;
      left: 30%;
    }

    .bg-glow.g2 {
      background: #ec4899;
      bottom: 10%;
      right: 25%;
      animation-delay: 2s;
    }

    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.4; }
    }

    /* 数字表示 */
    .number-display {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .number {
      font-size: clamp(8rem, 30vw, 28rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6, #fb923c);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 6s ease-in-out infinite;
      filter: drop-shadow(0 0 60px rgba(139, 92, 246, 0.4));
      user-select: none;
    }

    @keyframes gradient-shift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ラベル（任意） */
    .label {
      font-size: clamp(0.9rem, 2vw, 1.6rem);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 0.5em;
    }
  </style>
</head>
<body>

  <!-- 背景エフェクト -->
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>

  <!-- メイン表示 -->
  <div class="number-display">
    <div class="number" id="number"></div>
    <div class="label" id="label"></div>
  </div>

  <script>
    // ============================================================
    //  ★ 設定はここだけで変更 ★
    // ============================================================
    const CONFIG = {
      number: 42,        // 表示する数字
      label:  "",        // 数字の下に表示するラベル（空文字で非表示）
    };
    // ============================================================

    document.getElementById("number").textContent = CONFIG.number;
    document.getElementById("label").textContent  = CONFIG.label;

    if (!CONFIG.label) {
      document.getElementById("label").style.display = "none";
    }
  </script>

</body>
</html>
